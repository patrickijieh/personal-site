name: Deploy to Server

on:
  pull_request:
    branches:
      - deployment
    types:
      - closed
  push:
    branches:
      - deployment

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.merged || github.event.push
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set Up SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
    
    - name: Pull From GitHub & Deploy
      run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "cd /home/server/personalsite\
          && git checkout deployment\
          && git pull origin deployment;\
          tmux kill-session -t website;\
          tmux new -d -s website\
          && tmux send-keys -t website \"./mvnw verify && java -jar target/personalsite-2.0.jar\" ENTER"
          echo "Successfully pulled from repository and deployed on remote server."


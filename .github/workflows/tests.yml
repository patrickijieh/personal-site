name: Linting and Testing

on:
  push:
    branches:
      - main
      - deployment 
  pull_request:
    branches:
      - main
      - deployment

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: |
        ./mvnw verify --file pom.xml
